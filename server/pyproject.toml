[project]
name = "malkong-server"
version = "0.1.0"
description = "말콩 agent 서버 — LLM 프록시, L1 지식 검색, 사용량 제어"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic[vertex]>=1.11.0",
    "fastapi>=0.142.2",
    "google-genai>=2.27.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
