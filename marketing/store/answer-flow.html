<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>육아버디 스토어 — 근거로 답해요</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      /*
       * 스토어 첫 장 — 버디가 답을 만드는 순서(서버 /v1/ask)와 진짜 앱 화면. 앱 디자인(시안 B 「단정한 비서」)을 따른다:
       * 밝은 바탕 · 먹색 글 · 포인트는 코랄 하나 · 글꼴 IBM Plex Sans KR. 글은 짧게.
       * ?v=ios 는 1290×2796(앱스토어 6.9"), ?v=play 는 1290×2293 을 0.8372 배로 찍어 1080×1920(구글 플레이 9:16).
       * 실제 동작과 맞춘다 — 출처는 질병관리청 · 국민건강보험공단 · 미국 CDC 뿐, 모델 회사 이름은 쓰지 않는다(store-toon.md).
       */
      :root { --ink: #16161a; --sub: #5e5e69; --line: #e3e3e8; --soft: #f1f1f4; --accent: #c64536; }
      html, body { margin: 0; background: #fafaf8; }
      #c {
        position: relative; width: 1290px; overflow: hidden; color: var(--ink);
        font-family: 'IBM Plex Sans KR', sans-serif; letter-spacing: -0.6px; word-break: keep-all;
        background: radial-gradient(90% 45% at 50% 0%, #ffffff 0%, #f6f5f2 70%), #f6f5f2;
      }
      .abs { position: absolute; left: 0; right: 0; }
      .brand { display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 600; color: var(--sub); }
      h1 { margin: 0; text-align: center; font-weight: 700; line-height: 1.18; letter-spacing: -3px; }
      h1 em { font-style: normal; color: var(--accent); }
      .sub { text-align: center; color: var(--sub); font-weight: 500; line-height: 1.45; }

      /* 답을 만드는 순서 — 네 걸음 */
      .flow { margin: 0 auto; background: #fff; border: 2px solid var(--line); border-radius: 44px; }
      .steps { display: flex; align-items: flex-start; justify-content: space-between; }
      .step { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .icon { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--soft); }
      .icon svg { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-weight: 600; line-height: 1.3; }
      .arrow { flex: none; display: flex; align-items: center; }
      .arrow svg { stroke: #b9b9c2; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .src { border-top: 2px solid var(--soft); text-align: center; color: var(--sub); font-weight: 500; }

      /* 진짜 앱 화면 */
      .screen {
        margin: 0 auto; background: #fff; border-radius: 52px; overflow: hidden; position: relative;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.02), 0 40px 90px rgba(22, 22, 26, 0.10); border: 2px solid var(--line);
      }
      .screen img { display: block; }
      .ring { position: absolute; border: 4px solid var(--accent); border-radius: 26px; }
      .loop { display: flex; align-items: center; justify-content: center; gap: 18px; font-weight: 600; }
      .loop svg { fill: none; stroke: var(--accent); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <script>
      const ios = (new URLSearchParams(location.search).get('v') ?? 'ios') !== 'play';
      const H = ios ? 2796 : 2293;
      const L = ios
        ? { h1Top: 300, h1: 122, subTop: 630, sub: 42, flowTop: 800, flowW: 1150, icon: 112, label: 34, src: 30, screenTop: 1370, screenW: 1150, loopTop: 2540, loop: 40 }
        : { h1Top: 150, h1: 104, subTop: 430, sub: 37, flowTop: 580, flowW: 1150, icon: 96, label: 31, src: 27, screenTop: 1040, screenW: 1000, loopTop: 2130, loop: 36 };
      const c = document.getElementById('c');
      c.style.height = H + 'px';
      const add = (html) => c.insertAdjacentHTML('beforeend', html);

      add(`<h1 class="abs" style="top:${L.h1Top}px;font-size:${L.h1}px">검색 대신,<br><em>근거</em>로 답해요</h1>`);
      add(`<div class="abs sub" style="top:${L.subTop}px;font-size:${L.sub}px">공공 기관 지식에서 찾고, 우리 아기 기준으로</div>`);

      // 네 걸음 — 서버 /v1/ask 의 순서: 지식 → 위험 신호 규칙 → 맞는 지식 + 아기 기록으로 AI 가 정리 → 답 검사
      const ICON = {
        book: '<path d="M10 14 h14 a6 6 0 0 1 6 6 v28 a4 4 0 0 0 -4 -4 H10 z M50 14 H36 a6 6 0 0 0 -6 6 v28 a4 4 0 0 1 4 -4 h16 z"/>',
        alert: '<path d="M30 10 L53 50 H7 Z"/><path d="M30 25 v11"/><path d="M30 43 v0.5"/>',
        baby: '<circle cx="30" cy="27" r="15"/><path d="M24 25 v1 M36 25 v1"/><path d="M25 33 q5 4 10 0"/><path d="M30 12 q-5 -6 2 -7"/><path d="M14 52 q16 -14 32 0"/>',
        check: '<path d="M30 8 L49 15 V28 C49 40 41 48 30 52 C19 48 11 40 11 28 V15 Z"/><path d="M21 30 L27.5 36.5 L40 24"/>',
      };
      const STEPS = [['book', '공공 지식'], ['alert', '위험 신호<br>먼저 확인'], ['baby', '우리 아기<br>맞춤'], ['check', '답 검사']];
      const arrow = `<div class="arrow" style="height:${L.icon}px"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M4 17 H28 M21 10 L28 17 L21 24"/></svg></div>`;
      add(`<div class="abs" style="top:${L.flowTop}px"><div class="flow" style="width:${L.flowW}px">
        <div class="steps" style="padding:${ios ? 56 : 44}px ${ios ? 44 : 36}px ${ios ? 44 : 34}px">
          ${STEPS.map(([icon, label]) => `<div class="step" style="gap:${ios ? 24 : 18}px">
              <div class="icon" style="width:${L.icon}px;height:${L.icon}px"><svg viewBox="0 0 60 60" width="${L.icon * 0.54}" height="${L.icon * 0.54}">${ICON[icon]}</svg></div>
              <div class="label" style="font-size:${L.label}px">${label}</div></div>`).join(arrow)}
        </div>
        <div class="src" style="font-size:${L.src}px;padding:${ios ? 30 : 24}px 0 ${ios ? 34 : 28}px">출처 · 질병관리청 · 국민건강보험공단 · 미국 CDC</div>
      </div></div>`);

      // 진짜 앱 화면 — 머리 줄(shots/answer-head.png 1170×150) + 질문과 답(shots/answer-qa.png 1170×930)
      const k = L.screenW / 1170;
      add(`<div class="abs" style="top:${L.screenTop}px"><div class="screen" style="width:${L.screenW}px">
        <img src="shots/answer-head.png" style="width:${L.screenW}px;height:${150 * k}px"/>
        <img src="shots/answer-qa.png" style="width:${L.screenW}px;height:${930 * k}px"/>
        <div class="ring" style="left:${44 * k}px;top:${(150 + 640) * k}px;width:${520 * k}px;height:${178 * k}px"></div>
      </div></div>`);

      add(`<div class="abs loop" style="top:${L.loopTop}px;font-size:${L.loop}px">
        <svg width="${L.loop * 1.2}" height="${L.loop * 1.2}" viewBox="0 0 48 48"><path d="M40 20 A17 17 0 0 0 10 16 M8 28 A17 17 0 0 0 38 32"/><path d="M41 10 V20 H31 M7 38 V28 H17"/></svg>
        대화할수록 우리 아기에게 더 맞게 답해요</div>`);
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
    </script>
  </body>
</html>
