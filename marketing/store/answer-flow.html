<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>육아버디 스토어 — 이렇게 답해요</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=block"
      rel="stylesheet"
    />
    <style>
      /*
       * 스토어 첫 장 — 버디가 답을 만드는 과정(서버 /v1/ask 의 실제 순서)과 진짜 앱 화면.
       * ?v=ios 는 1290×2796(앱스토어 6.9"), ?v=play 는 1290×2293 을 0.8372 배로 찍어 1080×1920(구글 플레이 9:16).
       * 글은 실제 동작과 맞춘다: 출처는 질병관리청 · 국민건강보험공단 · 미국 CDC 뿐이고, 「모든 답에 출처」라고 하지 않는다.
       * 모델 회사 이름(상표)은 쓰지 않고 「AI」라고 한다(docs/product/store-toon.md 규칙).
       */
      :root {
        --ink: #f4f2fb; --dim: #b9b5cc; --faint: #8d89a3;
        --mint: #4fb39a; --rose: #e0607a; --blue: #7d8fe0; --gold: #e9b03c; --coral: #f08a7e; --yellow: #fdd686;
      }
      html, body { margin: 0; background: #0d0d14; }
      #c {
        position: relative; width: 1290px; overflow: hidden; color: var(--ink);
        font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.5px; word-break: keep-all;
        background:
          radial-gradient(70% 40% at 15% 0%, rgba(240, 138, 126, 0.28), transparent 70%),
          radial-gradient(60% 35% at 100% 38%, rgba(125, 143, 224, 0.26), transparent 70%),
          radial-gradient(70% 40% at 0% 80%, rgba(79, 179, 154, 0.18), transparent 70%),
          linear-gradient(180deg, #1a1726 0%, #12121c 45%, #0d0d14 100%);
      }
      #stars { position: absolute; inset: 0; }
      .abs { position: absolute; }

      .eyebrow {
        display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px 12px 14px; border-radius: 99px;
        background: rgba(253, 214, 134, 0.12); border: 2px solid rgba(253, 214, 134, 0.35);
        color: var(--yellow); font-weight: 700; font-size: 34px;
      }
      .eyebrow img { width: 54px; height: 50px; }
      h1 { margin: 0; font-weight: 900; line-height: 1.16; letter-spacing: -3px; }
      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, var(--yellow), var(--coral));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub { color: var(--dim); font-weight: 500; line-height: 1.45; }

      /* 흐름 — 왼쪽 빛줄기 위의 번호 구슬과 설명 */
      .rail { position: absolute; width: 8px; border-radius: 8px; filter: drop-shadow(0 0 14px rgba(240, 138, 126, 0.7)); }
      .step { position: absolute; left: 0; right: 60px; display: flex; gap: 40px; align-items: flex-start; }
      .node {
        flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), transparent 45%), var(--c);
        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.06), 0 0 48px var(--c);
      }
      .node svg { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .num { font-size: 26px; font-weight: 900; color: var(--c); letter-spacing: 1px; }
      .title { font-weight: 900; line-height: 1.2; letter-spacing: -1.5px; }
      .desc { color: var(--dim); font-weight: 500; line-height: 1.42; margin-top: 8px; }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .chip { font-size: 26px; font-weight: 700; padding: 6px 16px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); color: var(--ink); }
      .chip i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; background: var(--d); vertical-align: 2px; }
      .warn { display: inline-block; margin-left: 14px; font-size: 26px; font-weight: 900; padding: 4px 16px; border-radius: 99px; background: rgba(224, 96, 122, 0.2); color: #ff9db0; vertical-align: 6px; }

      /* 진짜 앱 화면 카드 */
      .card {
        position: absolute; background: #fff; border-radius: 44px; overflow: hidden;
        box-shadow: 0 0 0 4px rgba(253, 214, 134, 0.55), 0 0 80px rgba(240, 138, 126, 0.45), 0 40px 90px rgba(0, 0, 0, 0.55);
      }
      .card img { display: block; }
      .tag {
        position: absolute; display: flex; align-items: center; gap: 12px; white-space: nowrap;
        padding: 12px 24px 12px 14px; border-radius: 99px; font-weight: 900; color: #1b1b22;
        background: var(--c); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 30px var(--c);
      }
      .tag b { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #1b1b22; color: var(--c); font-size: 24px; }

      /* 아래 둘 — 답과 출처, 대화할수록 */
      .duo { position: absolute; display: flex; gap: 28px; }
      .box { flex: 1; border-radius: 34px; padding: 30px 34px; background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(255, 255, 255, 0.1); }
      .box .title { display: flex; align-items: center; gap: 14px; }
      .box .title span { flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--c); color: #1b1b22; font-weight: 900; }
      .brand { position: absolute; display: flex; align-items: center; gap: 12px; color: var(--faint); font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="c"><svg id="stars"></svg></div>
    <script src="../toon/draw.js"></script>
    <script>
      const v = new URLSearchParams(location.search).get('v') ?? 'ios';
      const ios = v !== 'play';
      const H = ios ? 2796 : 2293;
      /* 크기 — 앱스토어(키 큼)와 구글 플레이(9:16)는 같은 그림을 높이만 달리 줄인다 */
      const L = ios
        ? { top: 120, h1: 112, sub: 42, flowTop: 690, gap: 38, node: 108, title: 52, desc: 34, cardTop: 1690, cardW: 1010, tag: 32, duoTop: 2540, boxTitle: 40, boxDesc: 30 }
        : { top: 64, h1: 86, sub: 32, flowTop: 532, gap: 22, node: 88, title: 44, desc: 29, cardTop: 1380, cardW: 850, tag: 27, duoTop: 2090, boxTitle: 34, boxDesc: 26 };
      const c = document.getElementById('c');
      c.style.height = H + 'px';

      // 별
      let seed = 11;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      document.getElementById('stars').innerHTML = Array.from({ length: 140 }, () =>
        `<circle cx="${(rand() * 1290).toFixed(0)}" cy="${(rand() * H).toFixed(0)}" r="${(0.8 + rand() * 1.8).toFixed(1)}" fill="#fff" opacity="${(0.15 + rand() * 0.5).toFixed(2)}"/>`).join('');
      document.getElementById('stars').setAttribute('viewBox', `0 0 1290 ${H}`);

      const add = (html) => c.insertAdjacentHTML('beforeend', html);

      // 머리
      add(`<div class="abs" style="left:80px;right:80px;top:${L.top}px">
        <div class="eyebrow"><img src="../../assets/images/mascot/face.png"/>버디는 이렇게 답해요</div>
        <h1 style="font-size:${L.h1}px;margin-top:${ios ? 44 : 32}px">검색 대신,<br><em>근거</em>로 답해요</h1>
        <div class="sub" style="font-size:${L.sub}px;margin-top:${ios ? 28 : 18}px">공공 기관 지식과 우리 아기 기록으로<br>답을 만들고, 한 번 더 확인해요</div>
      </div>`);

      // 머리 오른쪽 — 앱 「우리 아기」 탭의 지식 지도(marketing/toon/draw.js 의 galaxy)
      const gw = ios ? 620 : 560, gh = ios ? 520 : 470;
      add(`<svg class="abs" style="right:${ios ? -30 : -20}px;top:${ios ? 150 : 110}px;opacity:0.95" width="${gw}" height="${gh}" viewBox="0 0 ${gw / 1.25} ${gh / 1.25}">${T.galaxy(gw / 1.25, gh / 1.25, { yaw: 1.02, zoom: 1.4 })}</svg>`);

      // 아이콘 — 선 그림
      const ICON = {
        book: '<path d="M8 10 h16 a6 6 0 0 1 6 6 v30 a4 4 0 0 0 -4 -4 H8 z M50 10 H34 a6 6 0 0 0 -6 6 v30 a4 4 0 0 1 4 -4 h18 z"/>',
        alert: '<path d="M29 8 L54 50 H4 Z"/><path d="M29 24 v12"/><circle cx="29" cy="43" r="1.6" fill="#fff"/>',
        find: '<circle cx="24" cy="24" r="14"/><path d="M34 34 L50 50"/><path d="M18 24 h12 M24 18 v12"/>',
        check: '<path d="M29 6 L50 14 V28 C50 40 41 49 29 53 C17 49 8 40 8 28 V14 Z"/><path d="M19 29 L26 36 L40 22"/>',
      };
      const STEPS = [
        { n: '01', color: 'var(--mint)', icon: 'book', title: '공공 기관 지식', desc: '질병관리청 · 국민건강보험공단 · 미국 CDC.<br>사람이 확인한 항목만, 항목마다 출처를 달아요',
          chips: [['접종', '#E0607A'], ['검진', '#4FB39A'], ['발달', '#E9B03C'], ['수유', '#E8825F'], ['수면', '#7D8FE0'], ['안전', '#B08BDB'], ['부모 돌봄', '#F08A7E']] },
        { n: '02', color: 'var(--rose)', icon: 'alert', title: '위험 신호부터 확인', warn: 'AI 거치지 않음', desc: '위험한 증상이면 곧바로 병원 안내로 답해요' },
        { n: '03', color: 'var(--blue)', icon: 'find', title: '맞는 지식 + 우리 아기 기록', desc: '질문과 개월 수에 맞는 지식만 골라요.<br>아기 기록은 이 기기에만 저장돼요' },
        { n: '04', color: 'var(--gold)', icon: 'check', title: 'AI가 정리하고, 한 번 더 검사', desc: '지어낸 출처는 버리고, 공공 근거가 없으면<br>「일반 정보」라고 밝혀요' },
      ];
      const nodeX = 80;
      add(`<div class="rail" style="left:${nodeX + L.node / 2 - 4}px;top:${L.flowTop + L.node / 2}px;height:${L.cardTop - L.flowTop - L.node / 2 + 10}px;
        background:linear-gradient(180deg, var(--mint), var(--rose) 30%, var(--blue) 58%, var(--gold) 82%, var(--yellow))"></div>`);
      add(`<div id="flow" class="abs" style="left:${nodeX}px;right:60px;top:${L.flowTop}px;display:flex;flex-direction:column;gap:${L.gap}px"></div>`);
      const flow = document.getElementById('flow');
      STEPS.forEach((s) => {
        flow.insertAdjacentHTML('beforeend', `<div class="step" style="position:relative;right:auto;--c:${s.color}">
          <div class="node" style="width:${L.node}px;height:${L.node}px"><svg viewBox="0 0 58 58" width="${L.node * 0.52}" height="${L.node * 0.52}">${ICON[s.icon]}</svg></div>
          <div style="padding-top:${ios ? 4 : 2}px">
            <div class="num">STEP ${s.n}</div>
            <div class="title" style="font-size:${L.title}px">${s.title}${s.warn ? `<span class="warn">${s.warn}</span>` : ''}</div>
            <div class="desc" style="font-size:${L.desc}px">${s.desc}</div>
            ${s.chips ? `<div class="chips">${s.chips.map(([t, d]) => `<span class="chip" style="--d:${d}"><i></i>${t}</span>`).join('')}</div>` : ''}
          </div></div>`);
      });

      // 진짜 앱 화면 — shots/answer-qa.png(1170×930, 실제 웹 화면에서 질문과 답 부분)
      const k = L.cardW / 1170, cardX = (1290 - L.cardW) / 2, cardH = 930 * k;
      add(`<div class="card" style="left:${cardX}px;top:${L.cardTop}px;width:${L.cardW}px;height:${cardH}px">
        <img src="shots/answer-qa.png" style="width:${L.cardW}px;height:${cardH}px"/></div>`);
      // 화면 위 표시 — 실제 화면 요소 옆에
      const tags = [
        { y: 255, x: 690, color: '#7D8FE0', n: '?', text: '무엇을 보고 답했는지' },
        { y: 508, x: 1000, color: '#E9B03C', n: '★', text: '우리 아기 나이에 맞춰', right: true },
        { y: 783, x: 560, color: '#4FB39A', n: '✓', text: '공공 기관 출처' },
        { y: 878, x: 300, color: '#F08A7E', n: '♥', text: '피드백으로 답을 다듬어요' },
      ];
      tags.forEach((t) => {
        const ty = L.cardTop + t.y * k - L.tag * 0.95, tx = cardX + t.x * k;
        add(`<div class="tag" style="--c:${t.color};font-size:${L.tag}px;top:${ty}px;${t.right ? `right:${Math.max(30, 1290 - cardX - L.cardW - 40)}px` : `left:${tx}px`}"><b>${t.n}</b>${t.text}</div>`);
      });

      // 아래 둘
      add(`<div class="duo" style="left:80px;right:80px;top:${L.duoTop}px">
        <div class="box" style="--c:var(--yellow)"><div class="title" style="font-size:${L.boxTitle}px"><span style="width:${L.boxTitle * 1.3}px;height:${L.boxTitle * 1.3}px;font-size:${L.boxTitle * 0.6}px">05</span>답 + 출처</div>
          <div class="desc" style="font-size:${L.boxDesc}px">사실 · 일반 · 판단 수위와<br>무엇을 보고 답했는지까지</div></div>
        <div class="box" style="--c:var(--coral)"><div class="title" style="font-size:${L.boxTitle}px"><span style="width:${L.boxTitle * 1.3}px;height:${L.boxTitle * 1.3}px;font-size:${L.boxTitle * 0.6}px">06</span>대화할수록 더 정확하게</div>
          <div class="desc" style="font-size:${L.boxDesc}px">되묻기에 답하면 우리 아기 기록으로,<br>피드백은 다음 답을 다듬는 데로</div></div>
      </div>`);
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
    </script>
  </body>
</html>
