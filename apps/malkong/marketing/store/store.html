<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>육아버디 스토어 스크린샷</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      /*
       * 스토어 스크린샷 일곱 장 — 문구 한 줄 + 진짜 앱 화면(docs/product/store-toon.md 「스토어 스크린샷」, task common/024 · 028).
       * 앱 디자인 언어: 밝은 바탕 · 먹색 · 코랄 하나 · IBM Plex Sans KR. 만화 캐릭터는 넣지 않는다(Julian, 2026-10-12).
       * ?p=home|year|routine|todo|shop|growth|family, ?v=ios(1290×2796) | play(1290×2293 을 0.8372 배로 → 1080×1920)
       */
      :root { --ink: #16161a; --sub: #5e5e69; --mute: #8a8a95; --line: #dedee4; --accent: #c64536; --accentSoft: #fcebe8; }
      html, body { margin: 0; background: #f6f5f2; }
      #c {
        position: relative; width: 1290px; overflow: hidden; color: var(--ink);
        font-family: 'IBM Plex Sans KR', sans-serif; letter-spacing: -0.6px; word-break: keep-all;
        background: radial-gradient(90% 40% at 50% 0%, #ffffff 0%, #f6f5f2 70%), #f6f5f2;
      }
      .abs { position: absolute; left: 0; right: 0; }
      h1 { margin: 0; text-align: center; font-weight: 700; line-height: 1.18; letter-spacing: -3px; }
      h1 em { font-style: normal; color: var(--accent); }
      .screen {
        position: absolute; background: #fff; border-radius: 56px; overflow: hidden;
        box-shadow: 0 40px 90px rgba(22, 22, 26, 0.12); border: 2px solid var(--line);
      }
      .screen .part { overflow: hidden; }
      .screen img { display: block; }
      .ring { position: absolute; border: 4px solid var(--accent); border-radius: 26px; }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <script>
      const q = new URLSearchParams(location.search);
      const ios = (q.get('v') ?? 'ios') !== 'play';
      const key = q.get('p') ?? 'routine';
      const H = ios ? 2796 : 2293;
      // 자리 — 아이폰(1290×2796)과 구글 플레이(1290×2293, 나중에 0.8372 배)
      const L = ios ? { h1Top: 150, h1: 104, screenTop: 520, screenW: 1060 } : { h1Top: 90, h1: 86, screenTop: 400, screenW: 900 };

      /*
       * 장면 — 앱 화면(shots/*.png, 1170×2532)을 그대로 보이거나 crop 으로 이어 붙인다:
       *   head 는 앱 머리 줄(0~head), body 는 그 아래 이어 붙일 시작 줄(브리핑 카드를 건너뛰어 질문부터).
       * ring 은 앱 화면 좌표 [x, y, w, h] 의 코랄 테
       */
      const PAGES = {
        home: { title: '앱을 열면<br>이번 주 챙길 일이 <em>먼저</em>', shot: 'home', ring: [52, 895, 1066, 623] },
        // 슬로건(product-brief 「스토어 문안」) — 긴 줄이라 글자를 조금 줄인다
        year: { title: '생일만 넣으세요.<br>1년 치 챙길 일은 <em>버디</em>가 채워요', shot: 'year', size: 0.88 },
        routine: { title: '며칠마다 챙기는 일,<br>한 번 눌러 <em>완료</em>', shot: 'routine' },
        todo: { title: '적으면 <em>날짜</em>를 읽고<br>그때 알려 드려요', shot: 'todo', ring: [40, 1955, 1090, 380] },
        shop: { title: '살 것은 살 곳별로,<br><em>배송 중</em>까지 한눈에', shot: 'shop', ring: [44, 1512, 1082, 338] },
        growth: { title: '이맘때 우리 아기,<br><em>한눈에</em>', shot: 'growth', ring: [52, 1216, 1066, 537] },
        family: { title: '누가 했는지<br><em>가족</em>이 함께 봐요', shot: 'family', ring: [250, 1545, 640, 590] },
      };
      const p = PAGES[key];
      const c = document.getElementById('c');
      c.style.height = H + 'px';
      const add = (html) => c.insertAdjacentHTML('beforeend', html);

      add(`<h1 class="abs" style="top:${L.h1Top}px;font-size:${Math.round(L.h1 * (p.size ?? 1))}px">${p.title}</h1>`);

      // 진짜 앱 화면 — 아래는 화면 밖으로 잘린다(폰이 이어지는 느낌)
      const k = L.screenW / 1170, sx = (1290 - L.screenW) / 2;
      const img = (from) => `<img src="shots/${p.shot}.png" style="width:${L.screenW}px;height:${2532 * k}px;margin-top:${-from * k}px"/>`;
      const head = p.crop?.head ?? 0, body = p.crop?.body ?? 0;
      // 앱 좌표 y → 이어 붙인 화면의 y
      const ty = (y) => (y < head ? y : head + (y - body)) * k;
      const parts = (head ? `<div class="part" style="height:${head * k}px">${img(0)}</div>` : '') + `<div class="part">${img(body)}</div>`;
      const ring = p.ring
        ? `<div class="ring" style="left:${p.ring[0] * k}px;top:${ty(p.ring[1])}px;width:${p.ring[2] * k}px;height:${p.ring[3] * k}px"></div>`
        : '';
      // 높이는 이어 붙인 화면만큼 — 전체 화면이면 바닥 아래로 잘리고, 잘라 붙인 화면이면 제목 아래 남은 자리 가운데에 둔다
      const room = H - L.screenTop - 60;
      const contentH = (head + 2532 - body) * k;
      const screenH = Math.min(contentH, room + 120);
      const screenTop = contentH < room ? L.screenTop + (room - contentH) / 2 : L.screenTop;
      add(`<div class="screen" style="left:${sx}px;top:${screenTop}px;width:${L.screenW}px;height:${screenH}px">${parts}${ring}</div>`);

      document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
    </script>
  </body>
</html>
