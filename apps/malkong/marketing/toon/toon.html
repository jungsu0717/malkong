<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>육아버디 홍보 만화</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #fff; }
      #stage {
        position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff;
        font-family: 'Noto Sans KR', sans-serif; color: #1b1b1b; word-break: keep-all;
      }
      .layer { position: absolute; inset: 0; }
      svg.art { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
      .title {
        position: absolute; left: 40px; right: 40px; top: 64px; text-align: center;
        font-weight: 900; font-size: 64px; line-height: 1.28; letter-spacing: -1.5px;
      }
      .t {
        position: absolute; transform: translate(-50%, -50%); text-align: center;
        font-family: 'Gaegu', sans-serif; font-weight: 700; line-height: 1.12; white-space: pre-line; letter-spacing: -0.5px; width: max-content;
      }
      .big {
        position: absolute; transform: translate(-50%, -50%); font-family: 'Black Han Sans', sans-serif; white-space: nowrap;
        text-shadow: -5px -5px 0 #fff, 5px -5px 0 #fff, -5px 5px 0 #fff, 5px 5px 0 #fff, 0 6px 0 #fff, 0 -6px 0 #fff, 6px 0 0 #fff, -6px 0 0 #fff;
      }
      .cap {
        position: absolute; padding: 14px 26px; border: 5px solid #1b1b1b; background: #fff;
        font-weight: 700; font-size: 38px; letter-spacing: -1px; white-space: pre-line; line-height: 1.3;
      }
      .phone {
        position: absolute; box-sizing: border-box; border: 14px solid #1f1f1f; border-radius: 56px; background: #fff; overflow: hidden;
        box-shadow: 0 0 0 4px #1b1b1b;
      }
      .card { position: absolute; box-sizing: border-box; background: #fff; border: 4px solid #1b1b1b; overflow: hidden; }
      .gray { filter: grayscale(1); }
      .mark { position: absolute; right: 34px; top: 24px; font-family: 'Gaegu'; font-weight: 700; font-size: 30px; color: #9a9a9a; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="stage"></div>
    <script src="draw.js"></script>
    <script src="panels.js"></script>
    <script>
      const key = new URLSearchParams(location.search).get('p') ?? '1';
      const panel = window.PANELS[key]();
      const stage = document.getElementById('stage');
      stage.style.background = panel.bg ?? '#fff';
      let html = '';
      for (const layer of panel.layers) {
        if (layer.svg !== undefined) {
          const body = layer.rough === false ? layer.svg : `<g filter="url(#rough)">${layer.svg}</g>`;
          html += `<svg class="art" viewBox="0 0 1080 1350">${body}</svg>`;
        } else {
          html += `<div class="layer">${layer.html}</div>`;
        }
      }
      if (panel.title) {
        html += `<div class="title" style="color:${panel.titleColor ?? '#1b1b1b'}">${panel.title}</div>`;
      }
      if (panel.mark !== false) html += `<div class="mark">육아버디</div>`;
      stage.innerHTML = html;
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
    </script>
  </body>
</html>
