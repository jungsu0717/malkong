[project]
name = "malkong-server"
version = "0.1.0"
description = "육아버디 서버 — 기기 키, 가족 공유, L1 지식 내려받기"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
