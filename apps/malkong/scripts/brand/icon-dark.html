<!doctype html>
<!--
  앱 아이콘(decisions/032) — 먹색 바탕에 버디 얼굴과 노란 별. 1024×1024 로 찍는다(투명 없음 — App Store 요구):
    크롬 --headless --hide-scrollbars --window-size=1024,1024 --screenshot=icon.png file://<이 파일>
  찍은 파일이 RGBA 면 투명을 먹색으로 덮어 RGB 로 바꾼다(clean-halo.mjs 의 toRgb).
  ?fg=1 이면 Android 적응형 전경(투명 바탕, 안전 영역 66% 안에 얼굴 · 별)
-->
<html><body style="margin:0">
<div id="c" style="position:relative;width:1024px;height:1024px;background:#16161A;display:flex;align-items:center;justify-content:center;overflow:hidden">
  <div id="box" style="position:relative;width:1024px;height:1024px;display:flex;align-items:center;justify-content:center">
    <img src="../../assets/images/mascot/face.png" style="width:68%;margin-top:3%">
    <svg viewBox="0 0 24 24" style="position:absolute;width:17%;height:17%;right:9%;top:8%"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1 6.1 20.3l1.3-6.5L2.5 9.3l6.6-.8z" fill="#FDD686"/></svg>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get('fg')) {
    document.getElementById('c').style.background = 'transparent';
    const box = document.getElementById('box');
    box.style.width = box.style.height = '676px';
  }
</script>
</body></html>
